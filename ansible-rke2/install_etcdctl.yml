---
- import_playbook: evaluate_ip.yml

- name: Install etcdctl on all RKE2 hosts
  hosts: ClusterGroup
  become: true

  vars:
    etcd_version: "v3.6.14"
    etcd_arch: "amd64"

    etcd_archive: "etcd-{{ etcd_version }}-linux-{{ etcd_arch }}.tar.gz"
    etcd_download_url: >-
      https://github.com/etcd-io/etcd/releases/download/{{ etcd_version }}/{{ etcd_archive }}

    etcd_tmp_dir: "/tmp/etcd-{{ etcd_version }}"
    etcdctl_path: "/var/lib/rancher/rke2/bin/etcdctl"

  tasks:
    - name: Check whether etcdctl is already installed
      ansible.builtin.stat:
        path: "{{ etcdctl_path }}"
      register: etcdctl_installed

    - name: Create temporary etcd directory
      ansible.builtin.file:
        path: "{{ etcd_tmp_dir }}"
        state: directory
        mode: "0755"
      when: not etcdctl_installed.stat.exists

    - name: Download etcd archive
      ansible.builtin.get_url:
        url: "{{ etcd_download_url }}"
        dest: "{{ etcd_tmp_dir }}/{{ etcd_archive }}"
        mode: "0644"
      when: not etcdctl_installed.stat.exists

    - name: Extract etcd archive
      ansible.builtin.unarchive:
        src: "{{ etcd_tmp_dir }}/{{ etcd_archive }}"
        dest: "{{ etcd_tmp_dir }}"
        remote_src: true
      when: not etcdctl_installed.stat.exists

    - name: Install etcdctl
      ansible.builtin.copy:
        src: >-
          {{ etcd_tmp_dir }}/etcd-{{ etcd_version }}-linux-{{ etcd_arch }}/etcdctl
        dest: "{{ etcdctl_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      when: not etcdctl_installed.stat.exists

    - name: Remove temporary etcd files
      ansible.builtin.file:
        path: "{{ etcd_tmp_dir }}"
        state: absent

    - name: Check etcdctl version
      become: true
      ansible.builtin.command:
        cmd: "{{ etcdctl_path }} version"
      register: etcdctl_version
      changed_when: false

    - name: Display etcdctl version
      ansible.builtin.debug:
        var: etcdctl_version.stdout_lines