---
- import_playbook: evaluate_ip.yml


- name: Revert networking to DHCP
  hosts: ClusterGroup
  become: yes
  gather_facts: no

  tasks:

    - name: Revert network interfaces to DHCP
      ansible.builtin.shell: |
        set -e

        HAS_INTERNAL="{{ 'yes' if internal_address is defined else 'no' }}"

        INTERFACES=""

        if [ "$HAS_INTERNAL" = "yes" ]; then

          for dev in $(nmcli -t -f DEVICE,TYPE device status |
            awk -F: '$2=="ethernet" || $2=="wifi" {print $1}'); do

            if [ -e "/sys/class/net/$dev/device" ]; then
              INTERFACES="$INTERFACES $dev"
            fi

          done

        else

          INTERFACES=$(ip route show default | awk '{print $5; exit}')

        fi


        if [ -z "$INTERFACES" ]; then
          echo "Could not determine network interfaces"
          exit 1
        fi


        for dev in $INTERFACES; do

          PROFILE=$(nmcli -g GENERAL.CONNECTION device show "$dev" | head -1)

          if [ -z "$PROFILE" ] || [ "$PROFILE" = "--" ]; then
            continue
          fi

          nmcli con mod "$PROFILE" \
            ipv4.method auto \
            ipv4.addresses "" \
            ipv4.gateway "" \
            ipv4.dns "" \
            ipv4.never-default no \
            ipv4.ignore-auto-dns no \
            connection.autoconnect yes

          systemd-run \
            --on-active=3s \
            /bin/bash -c "nmcli con up '$PROFILE'" \
            >/dev/null

        done

      args:
        executable: /bin/bash

      throttle: 1