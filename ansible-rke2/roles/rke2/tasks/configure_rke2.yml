---
- name: Ensure RKE2 configuration directory exists
  become: true
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure RKE2 server
  become: true
  ansible.builtin.template:
    src: rke2-server.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  when: inventory_hostname == groups['control'][0]

- name: Ensure RKE2 manifest directory exists
  become: true
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname == groups['control'][0]

- name: Deploy kube-vip manifest
  become: true
  ansible.builtin.template:
    src: templates/kube-vip.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/kube-vip.yaml
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname in groups['control'][0]

- name: Enable the rke2-server
  systemd:
    name: rke2-server
    enabled: yes
  when: inventory_hostname == groups['control'][0]

- name: Start the rke2-server
  systemd:
    name: rke2-server
    state: started
  when: inventory_hostname == groups['control'][0]

- name: Wait for RKE2 internal API to become reachable (port 9345)
  wait_for:
    host: "{{ ansible_host }}"
    port: 9345
    timeout: 180
  when: inventory_hostname == groups['control'][0]

- name: Wait for Kubernetes API to become reachable (port 6443)
  wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    timeout: 180
  when: inventory_hostname == groups['control'][0]

- name: Read RKE2 server token
  slurp:
    src: /var/lib/rancher/rke2/server/node-token
  register: rke2_token_file
  when: inventory_hostname == groups['control'][0]

- name: Set token fact on control plane node
  set_fact:
    rke2_token: "{{ rke2_token_file.content | b64decode | trim }}"
  when: inventory_hostname == groups['control'][0]

- name: Wait for kube-vip API address
  ansible.builtin.wait_for:
    host: "{{ kube_vip_address }}"
    port: 6443
    timeout: 180
  when: inventory_hostname == groups['control'][0]

- name: Wait for kube-vip RKE2 supervisor address
  ansible.builtin.wait_for:
    host: "{{ kube_vip_address }}"
    port: 9345
    timeout: 180
  when: inventory_hostname == groups['control'][0]

- name: Share token and server URL with all nodes
  set_fact:
    rke2_token: "{{ hostvars[groups['control'][0]].rke2_token }}"
  when: hostvars[groups['control'][0]].rke2_token is defined

- name: Debug token on manager
  debug:
    var: rke2_token

- name: Configure RKE2 server
  become: true
  ansible.builtin.template:
    src: rke2-server.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: "0600"
  when: inventory_hostname in groups['control']

- name: Enable the rke2-server (additional control planes)
  systemd:
    name: rke2-server
    enabled: yes
  when:
    - inventory_hostname in groups['control']
    - inventory_hostname != groups['control'][0]

- name: Start the rke2-server (additional control planes)
  systemd:
    name: rke2-server
    state: started
  when:
    - inventory_hostname in groups['control']
    - inventory_hostname != groups['control'][0]

- name: Wait for RKE2 internal API to become reachable (port 9345)
  wait_for:
    host: "{{ ansible_host }}"
    port: 9345
    timeout: 180
  when: inventory_hostname in groups['control']

- name: Wait for Kubernetes API to become reachable (port 6443)
  wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    timeout: 180
  when: inventory_hostname in groups['control']

- name: Configure RKE2 agent
  copy:
    dest: /etc/rancher/rke2/config.yaml
    content: |
      server: "https://{{ kube_vip_address }}:9345"
      token: "{{ rke2_token }}"
      node-ip: "{{ hostvars[inventory_hostname].external_address.ip }}"
    mode: '0755'
  when: inventory_hostname in groups['workers']

- name: Enable rke2-agent service
  systemd:
    name: rke2-agent
    enabled: yes
  when: inventory_hostname in groups['workers']

- name: Start rke2-agent service
  systemd:
    name: rke2-agent
    state: started
  when: inventory_hostname in groups['workers']