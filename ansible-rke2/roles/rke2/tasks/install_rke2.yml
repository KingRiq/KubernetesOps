- include_tasks: configure_host.yml

- name: Check whether RKE2 is already installed
  ansible.builtin.stat:
    path: /usr/bin/rke2
  register: rke2_installed

- name: Remove broken RKE2 repository left by installer
  ansible.builtin.file:
    path: /etc/yum.repos.d/rancher-rke2.repo
    state: absent

- name: Clean DNF metadata
  ansible.builtin.command:
    cmd: dnf clean all
  changed_when: false

- name: Get latest RKE2 version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/rancher/rke2/releases/latest
    method: GET
    return_content: true
  register: rke2_release
  delegate_to: localhost
  run_once: true
  changed_when: false

- name: Store latest RKE2 version
  ansible.builtin.set_fact:
    rke2_latest_version: "{{ rke2_release.json.tag_name }}"

- name: Display latest RKE2 version
  ansible.builtin.debug:
    msg: "Latest RKE2 version: {{ rke2_latest_version }}"
- name: Display latest RKE2 version
  ansible.builtin.debug:
    msg: "Latest RKE2 version: {{ rke2_latest_version }}"

- name: Download and install RKE2
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://get.rke2.io | \
      INSTALL_RKE2_VERSION="{{ rke2_latest_version }}" \
      INSTALL_RKE2_CHANNEL=latest \
      INSTALL_RKE2_METHOD=rpm \
      INSTALL_RKE2_TYPE="{{ 'server' if inventory_hostname in groups['control'] else 'agent' }}" \
      sh -
  args:
    executable: /bin/bash
  become: true

- name: Ensure Python3 and pip installed (Rocky/RedHat)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
    state: present
  become: true

- name: Ensure setuptools and wheel via pip
  ansible.builtin.pip:
    name:
      - setuptools
      - wheel
    executable: pip3
  become: true

- name: Install Kubernetes Python client
  ansible.builtin.pip:
    name: kubernetes
    executable: pip3
  become: true

- name: Create RKE2 config directory
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

- include_tasks: configure_rke2.yml