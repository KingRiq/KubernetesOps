- include_tasks: configure_host.yml

- name: Check whether RKE2 is already installed
  ansible.builtin.stat:
    path: /usr/bin/rke2
  register: rke2_installed

- name: Remove broken RKE2 repository left by installer
  ansible.builtin.file:
    path: /etc/yum.repos.d/rancher-rke2.repo
    state: absent

- name: Clean DNF metadata
  ansible.builtin.command:
    cmd: dnf clean all
  changed_when: false

- name: Download and install RKE2
  shell: |
    curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE={{ 'server' if inventory_hostname in groups['control'] else 'agent' }} sh -
  args:
    creates: /usr/local/bin/rke2

- name: Ensure Python3 and pip installed (Rocky/RedHat)
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
    state: present
  become: true

- name: Ensure setuptools and wheel via pip
  ansible.builtin.pip:
    name:
      - setuptools
      - wheel
    executable: pip3
  become: true

- name: Install Kubernetes Python client
  ansible.builtin.pip:
    name: kubernetes
    executable: pip3
  become: true

- name: Create RKE2 config directory
  file:
    path: /etc/rancher/rke2
    state: directory
    mode: '0755'

- include_tasks: configure_rke2.yml