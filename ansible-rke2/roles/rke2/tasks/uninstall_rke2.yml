- name: Unmount all NFS and CIFS mounts
  become: true
  shell: |
    umount -a -t nfs4,nfs,cifs,smbfs -f -l

- name: Unmount all NFS and CIFS mounts
  become: true
  shell: |
    umount -af
  failed_when: false

- name: Stop RKE2 services before Longhorn cleanup
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - rke2-server
    - rke2-agent
  failed_when: false

- name: Kill Longhorn, kubelet, and containerd leftovers
  become: true
  ansible.builtin.shell: |
    sudo systemctl stop rke2-server rke2-agent 2>/dev/null || true
    pkill -9 -f longhorn || true
    pkill -9 -f engine-manager || true
    pkill -9 -f instance-manager || true
    pkill -9 -f share-manager || true
    pkill -9 -f longhorn-csi || true
    pkill -9 -f kubelet || true
    pkill -9 -f containerd-shim || true
    pkill -9 -f containerd || true
    pkill -9 -f rke2 || true
    pkill -9 -f kube-vip || true
    pkill -9 -f calico || true
    pkill -9 -f flannel || true
    pkill -9 -f kubelet || true
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: KILLEMALL!!
  become: true
  script: "{{ role_path }}/files/killemall.sh"

- name: Run uninstall script (if exists)
  command: /usr/bin/rke2-uninstall.sh
  register: uninstall_result
  failed_when: false

- name: Lazy unmount kubelet mountpoints
  become: true
  ansible.builtin.shell: |
    timeout 60s bash -c '
      findmnt -R /var/lib/kubelet -n -o TARGET 2>/dev/null \
        | sort -r \
        | while read -r target; do
            umount -lf "$target" 2>/dev/null || true
          done
    '
  args:
    executable: /bin/bash
  changed_when: true
  failed_when: false

- name: Remove known RKE2 files and directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ rke2_cleanup_paths }}"

- include_role:
    name: firewall
  vars:
    firewall_ports: "{{ rke_ports }}"

- name: Verify that all ports are closed
  command: firewall-cmd --list-ports
  register: remaining_ports
  changed_when: false

- name: Show remaining open ports (if any)
  debug:
    msg: "Remaining open ports: {{ remaining_ports.stdout }}"
  when: remaining_ports.stdout | length > 0

########################################################################
# REMOVE RKE2 RUNTIME NETWORKING
########################################################################

- name: Remove leftover Calico interfaces
  become: true
  ansible.builtin.shell: |
    set -o pipefail

    for iface in $(ip -o link show |
                   awk -F': ' '$2 ~ /^cali/ {print $2}' |
                   cut -d@ -f1); do
      echo "Deleting $iface"
      ip link delete "$iface" || true
    done
  args:
    executable: /bin/bash
  register: calico_interfaces
  changed_when: calico_interfaces.stdout | length > 0


- name: Remove leftover RKE2 pod routes
  become: true
  ansible.builtin.shell: |
    set -o pipefail

    while ip -4 route show | grep -q '^10\.42\.'; do
      route="$(ip -4 route show | grep '^10\.42\.' | head -1)"
      echo "Deleting route: $route"
      ip route del $route || break
    done
  args:
    executable: /bin/bash
  register: pod_routes
  changed_when: pod_routes.stdout | length > 0


- name: Remove kube-vip address if still present
  become: true
  ansible.builtin.shell: |
    set -o pipefail

    for iface in $(ip -o -4 addr show |
                   awk '$4 == "{{ kube_vip_address }}/32" {print $2}'); do
      echo "Deleting {{ kube_vip_address }}/32 from $iface"
      ip addr del "{{ kube_vip_address }}/32" dev "$iface"
    done
  args:
    executable: /bin/bash
  register: kube_vip_address_cleanup
  changed_when: kube_vip_address_cleanup.stdout | length > 0