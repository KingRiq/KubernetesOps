---
- import_playbook: evaluate_ip.yml


- name: Configure static networking
  hosts: ClusterGroup
  become: yes
  gather_facts: no
  serial: 1

  tasks:

    - name: Configure static IPs
      ansible.builtin.shell: |
        set -e

        CURRENT_IP="{{ ansible_host }}"

        EXT_IP="{{ external_address.ip }}"
        GATEWAY="{{ external_address.gateway }}"
        DNS="{{ external_address.dns }}"
        PREFIX="{{ netmask }}"

        INT_IP="{{ hostvars[inventory_hostname].get('internal_address', {}).get('ip', '') }}"


        # Find the interface containing the IP Ansible used
        CURRENT_IF=$(
          ip -o -4 addr show |
          awk -v ip="$CURRENT_IP" '
          {
            split($4, addr, "/")
            if (addr[1] == ip) {
              print $2
              exit
            }
          }'
        )


        if [ -z "$CURRENT_IF" ]; then
          echo "Could not find interface containing $CURRENT_IP"
          exit 1
        fi


        # Find real physical / VM NICs
        DEVS=$(
          nmcli -t -f DEVICE,TYPE device status |
          while IFS=: read -r dev type; do

            case "$type" in
              ethernet|wifi)
                if [ -e "/sys/class/net/$dev/device" ]; then
                  echo "$dev"
                fi
                ;;
            esac

          done

          true
        )


        EXT_IF=""
        INT_IF=""


        # Diana / single-network host
        if [ -z "$INT_IP" ]; then

          EXT_IF="$CURRENT_IF"


        else

          EXT_PREFIX="${EXT_IP%.*}."
          INT_PREFIX="${INT_IP%.*}."


          # Determine whether the IP Ansible used is currently
          # on the external or internal network.
          case "$CURRENT_IP" in

            "$EXT_PREFIX"*)
              EXT_IF="$CURRENT_IF"
              ;;

            "$INT_PREFIX"*)
              INT_IF="$CURRENT_IF"
              ;;

            *)
              echo "Current IP $CURRENT_IP does not match expected networks"
              exit 1
              ;;

          esac


          # The other real NIC is the other network.
          for dev in $DEVS; do

            [ "$dev" = "$CURRENT_IF" ] && continue

            if [ -n "$EXT_IF" ]; then
              INT_IF="$dev"
            else
              EXT_IF="$dev"
            fi

            break

          done


          if [ -z "$EXT_IF" ] || [ -z "$INT_IF" ]; then
            echo "Could not determine both interfaces"
            exit 1
          fi

        fi


        # External profile
        EXT_CON=$(nmcli -g GENERAL.CONNECTION device show "$EXT_IF" | head -1)
        EXT_TYPE=$(nmcli -g GENERAL.TYPE device show "$EXT_IF" | head -1)


        if [ -z "$EXT_CON" ] || [ "$EXT_CON" = "--" ]; then

          if [ "$EXT_TYPE" = "wifi" ]; then
            echo "No Wi-Fi profile exists on $EXT_IF"
            exit 1
          fi

          if nmcli -t -f NAME con show | grep -Fxq external; then
            EXT_CON="external"
          else
            EXT_CON="external"

            nmcli con add \
              type ethernet \
              ifname "$EXT_IF" \
              con-name external \
              >/dev/null
          fi

        fi


        nmcli con mod "$EXT_CON" \
          connection.interface-name "$EXT_IF" \
          connection.autoconnect yes \
          ipv4.method manual \
          ipv4.addresses "$EXT_IP/$PREFIX" \
          ipv4.gateway "$GATEWAY" \
          ipv4.dns "$DNS" \
          ipv4.never-default no \
          ipv4.ignore-auto-dns no


        if [ "$EXT_TYPE" = "wifi" ]; then
          nmcli con mod "$EXT_CON" ipv6.method auto
        else
          nmcli con mod "$EXT_CON" ipv6.method disabled
        fi


        # Internal profile
        if [ -n "$INT_IP" ]; then

          INT_CON=$(nmcli -g GENERAL.CONNECTION device show "$INT_IF" | head -1)


          if [ -z "$INT_CON" ] || [ "$INT_CON" = "--" ]; then

            if nmcli -t -f NAME con show | grep -Fxq internal; then
              INT_CON="internal"
            else
              INT_CON="internal"

              nmcli con add \
                type ethernet \
                ifname "$INT_IF" \
                con-name internal \
                >/dev/null
            fi

          fi


          nmcli con mod "$INT_CON" \
            connection.interface-name "$INT_IF" \
            connection.autoconnect yes \
            ipv4.method manual \
            ipv4.addresses "$INT_IP/$PREFIX" \
            ipv4.gateway "" \
            ipv4.dns "" \
            ipv4.never-default yes \
            ipv4.ignore-auto-dns yes \
            ipv6.method disabled


          systemd-run \
            --on-active=3s \
            /bin/bash -c "nmcli con up '$INT_CON'; sleep 2; nmcli con up '$EXT_CON'" \
            >/dev/null

        else

          systemd-run \
            --on-active=3s \
            /bin/bash -c "nmcli con up '$EXT_CON'" \
            >/dev/null

        fi

      args:
        executable: /bin/bash