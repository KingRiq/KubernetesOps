---
- name: Evaluating IP of hosts
  hosts: ClusterGroup
  gather_facts: no

  tasks:

    - name: Save original IP
      ansible.builtin.set_fact:
        original_ip: "{{ ansible_host }}"


    - name: Try original IP
      ansible.builtin.wait_for_connection:
        timeout: 3
        connect_timeout: 2
      delegate_to: "{{ original_ip }}"
      vars:
        ansible_user: "{{ hostvars[inventory_hostname].ansible_user }}"
      register: original_test
      ignore_errors: yes


    - name: Try external IP
      ansible.builtin.wait_for_connection:
        timeout: 3
        connect_timeout: 2
      delegate_to: "{{ external_address.ip }}"
      vars:
        ansible_user: "{{ hostvars[inventory_hostname].ansible_user }}"
      register: external_test
      ignore_errors: yes
      when: original_test is failed


    - name: Use external IP
      ansible.builtin.set_fact:
        ansible_host: "{{ external_address.ip }}"
      when:
        - original_test is failed
        - external_test is succeeded


    - name: Try internal IP
      ansible.builtin.wait_for_connection:
        timeout: 3
        connect_timeout: 2
      delegate_to: "{{ internal_address.ip }}"
      vars:
        ansible_user: "{{ hostvars[inventory_hostname].ansible_user }}"
      register: internal_test
      ignore_errors: yes
      when:
        - original_test is failed
        - external_test is failed
        - internal_address is defined


    - name: Use internal IP
      ansible.builtin.set_fact:
        ansible_host: "{{ internal_address.ip }}"
      when:
        - original_test is failed
        - external_test is failed
        - internal_address is defined
        - internal_test is succeeded


    - name: Fail if host is unreachable
      ansible.builtin.fail:
        msg: "Could not reach {{ inventory_hostname }} on any configured IP."
      when:
        - original_test is failed
        - external_test is failed
        - internal_address is not defined or internal_test is failed


    - name: Show selected IP
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} -> {{ ansible_host }}"