---
- import_playbook: evaluate_ip.yml


- name: Promote RKE2 worker to control plane
  hosts: ClusterGroup
  become: true
  serial: 1

  vars:
    rke2_server_url: "https://{{ kube_vip_address }}:9345"

  pre_tasks:

    #################################################################
    # SAFETY
    #################################################################

    - name: Require Ansible limit
      ansible.builtin.assert:
        that:
          - ansible_limit is defined
          - ansible_limit | length > 0
        fail_msg: >-
          You must specify the worker to promote with -l.
          Example:
          ansible-playbook -i inventory/Galaxia.yml
          promote_control.yml -l g4

    - name: Ensure control group exists
      ansible.builtin.assert:
        that:
          - groups['control'] is defined
          - groups['control'] | length > 0
        fail_msg: >-
          No hosts exist in the control inventory group.

    - name: Prevent promotion of existing control-plane node
      ansible.builtin.assert:
        that:
          - inventory_hostname not in groups['control']
        fail_msg: >-
          {{ inventory_hostname }} is already in the control group.


    #################################################################
    # SELECT EXISTING CONTROL PLANE
    #################################################################

    - name: Select control-plane node
      ansible.builtin.set_fact:
        control_node: "{{ groups['control'] | first }}"

    - name: Set control-plane external IP
      ansible.builtin.set_fact:
        control_node_ip: >-
          {{ hostvars[control_node].external_address.ip }}

    - name: Verify control-plane external IP
      ansible.builtin.assert:
        that:
          - control_node_ip is defined
          - control_node_ip | length > 0
        fail_msg: >-
          No external_address.ip is defined for {{ control_node }}.

    - name: Display promotion information
      ansible.builtin.debug:
        msg:
          - "Node being promoted: {{ inventory_hostname }}"
          - "Existing control plane: {{ control_node }}"
          - "Control plane external IP: {{ control_node_ip }}"
          - "Target external IP: {{ hostvars[inventory_hostname].external_address.ip }}"
          - "RKE2 supervisor: {{ rke2_server_url }}"


    #################################################################
    # VERIFY EXISTING CONTROL PLANE
    #################################################################

    - name: Verify Kubernetes API from selected control plane
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - get
          - --raw=/readyz
      delegate_to: "{{ control_node }}"
      vars:
        ansible_host: "{{ hostvars[inventory_hostname].control_node_ip }}"
      register: control_ready
      changed_when: false

    - name: Verify control plane is ready
      ansible.builtin.assert:
        that:
          - control_ready.rc == 0
          - control_ready.stdout | trim == 'ok'
        fail_msg: >-
          {{ control_node }} at {{ control_node_ip }}
          is not a working Kubernetes control plane.


    #################################################################
    # READ CLUSTER TOKEN
    #################################################################

    - name: Read cluster token from existing control plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/rke2/server/node-token
      delegate_to: "{{ control_node }}"
      vars:
        ansible_host: "{{ hostvars[inventory_hostname].control_node_ip }}"
      register: cluster_token

    - name: Set RKE2 token
      ansible.builtin.set_fact:
        rke2_token: "{{ cluster_token.content | b64decode | trim }}"


  tasks:

    #################################################################
    # TARGET WORKER
    #
    # Stop existing agent.
    #################################################################

    - name: Stop RKE2 agent
      ansible.builtin.systemd:
        name: rke2-agent
        state: stopped
        enabled: false
      failed_when: false


    #################################################################
    # TARGET WORKER
    #
    # Remove old worker configuration/state.
    #################################################################

    - name: Remove old RKE2 config
      ansible.builtin.file:
        path: /etc/rancher/rke2/config.yaml
        state: absent

    - name: Check for RKE2 uninstall script
      ansible.builtin.stat:
        path: /usr/bin/rke2-uninstall.sh
      register: rke2_uninstall

    - name: Run uninstall script
      ansible.builtin.command:
        cmd: /usr/bin/rke2-uninstall.sh
      when: rke2_uninstall.stat.exists
      register: uninstall_result
      failed_when: false
      changed_when: true


    #################################################################
    # TARGET WORKER
    #
    # Configure as server.
    #################################################################

    - name: Create RKE2 config directory
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure node as RKE2 server
      ansible.builtin.copy:
        dest: /etc/rancher/rke2/config.yaml
        owner: root
        group: root
        mode: "0600"
        content: |
          server: "{{ rke2_server_url }}"
          token: "{{ rke2_token }}"
          node-ip: "{{ hostvars[inventory_hostname].external_address.ip }}"

          tls-san:
            - "{{ kube_vip_address }}"
            - "{{ hostvars[groups['control'][0]].external_address.ip }}"
            - "{{ hostvars[groups['control'][1]].external_address.ip }}"
            - "{{ hostvars[groups['control'][2]].external_address.ip }}"

          cluster-dns: 10.43.0.10

          disable:
            - rke2-traefik

          ingress-controller: none

          kube-apiserver-arg:
            - "default-not-ready-toleration-seconds=0"
            - "default-unreachable-toleration-seconds=0"

          kube-controller-manager-arg:
            - "node-monitor-grace-period=50s"
            - "node-monitor-period=2s"
            - "node-eviction-rate=1"


    #################################################################
    # TARGET WORKER
    #
    # Install server binaries if necessary.
    #################################################################

    - name: Download and install RKE2 server
      ansible.builtin.shell: |
        curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE=server sh -
      args:
        creates: /usr/local/bin/rke2


    #################################################################
    # TARGET WORKER
    #
    # Start server.
    #################################################################

    - name: Enable RKE2 server
      ansible.builtin.systemd:
        name: rke2-server
        enabled: true
        daemon_reload: true

    - name: Start RKE2 server
      ansible.builtin.systemd:
        name: rke2-server
        state: started


    #################################################################
    # TARGET WORKER
    #
    # Wait for local RKE2 services.
    #################################################################

    - name: Wait for RKE2 supervisor
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].external_address.ip }}"
        port: 9345
        timeout: 180

    - name: Wait for Kubernetes API
      ansible.builtin.wait_for:
        host: "{{ hostvars[inventory_hostname].external_address.ip }}"
        port: 6443
        timeout: 180


    #################################################################
    # CONTROL PLANE
    #
    # Verify promoted node joined and became Ready.
    #################################################################

    - name: Wait for promoted node to become Ready
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - wait
          - "node/{{ inventory_hostname }}"
          - --for=condition=Ready
          - --timeout=180s
      delegate_to: "{{ control_node }}"
      vars:
        ansible_host: "{{ hostvars[inventory_hostname].control_node_ip }}"
      changed_when: false

    - name: Get promoted node
      ansible.builtin.command:
        argv:
          - /var/lib/rancher/rke2/bin/kubectl
          - --kubeconfig
          - /etc/rancher/rke2/rke2.yaml
          - get
          - node
          - "{{ inventory_hostname }}"
          - -o
          - wide
      delegate_to: "{{ control_node }}"
      vars:
        ansible_host: "{{ hostvars[inventory_hostname].control_node_ip }}"
      register: promoted_node
      changed_when: false


    #################################################################
    # FINAL STATUS
    #################################################################

    - name: Display promoted node
      ansible.builtin.debug:
        msg:
          - "Node: {{ inventory_hostname }}"
          - "Role: RKE2 CONTROL PLANE"
          - "Existing control plane used: {{ control_node }}"
          - "Control plane IP: {{ control_node_ip }}"
          - "Target IP: {{ hostvars[inventory_hostname].external_address.ip }}"
          - "{{ promoted_node.stdout }}"